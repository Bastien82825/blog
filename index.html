<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部落格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="mhead" id="mhead"></header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><p class="loading">載入中…</p></main>
  <aside class="rail" id="rail"></aside>
</div>
<footer class="foot" id="foot"></footer>

<div class="lb" id="lb" hidden>
  <button class="lb-x" data-lb="close" aria-label="關閉">×</button>
  <button class="lb-nav lb-prev" data-lb="prev" aria-label="上一張">‹</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="lb-nav lb-next" data-lb="next" aria-label="下一張">›</button>
</div>

<script src="assets/common.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
